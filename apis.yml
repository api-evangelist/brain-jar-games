name: Brain Jar Games
description: Brain Jar Games is a fully-remote independent video game studio founded by AAA industry
  veterans who have shipped franchises including Mass Effect, Dragon Age, RIFT, and Call of Duty. The
  studio builds bold, vibrant, music-driven action games designed to be shared; its debut title, Dead
  as Disco, blends kinetic gunplay with rhythm-synced choreography. Brain Jar Games is backed by Menlo
  Ventures and Transcend, having raised $12.2M across seed funding, and operates a four-day, 32-hour
  work week with team members across North America, Europe, and Turkey. The company publishes no public
  API, SDK, or developer platform; this profile tracks it as a venture-portfolio lead in the API
  Evangelist network.
